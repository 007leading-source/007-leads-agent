<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Get Clients Ready to Buy</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #111827);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #0a0a0a;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .logo {
      display: block;
      margin: 0 auto 15px auto;
      max-width: 180px;
    }

    @keyframes goldGlow {
      0% {
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.3),
                     0 0 10px rgba(212, 175, 55, 0.2);
      }
      50% {
        text-shadow: 0 0 12px rgba(212, 175, 55, 0.7),
                     0 0 20px rgba(212, 175, 55, 0.5);
      }
      100% {
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.3),
                     0 0 10px rgba(212, 175, 55, 0.2);
      }
    }

    .tagline {
      text-align: center;
      margin-bottom: 20px;
      color: #d4af37;
      font-size: 16px;
      font-family: 'Playfair Display', serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: goldGlow 2.5s ease-in-out infinite;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #111;
      color: #fff;
    }

    input::placeholder,
    textarea::placeholder {
      color: #888;
    }

    select {
      color: #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #d4af37;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
    }

    button:hover {
      background: #b8962e;
    }
  </style>
</head>

<body>

<div class="container">

  <img src="007.jpg" alt="007 Leads Agent Logo" class="logo">

  <p class="tagline">We Deliver Clients Ready to Buy</p>

  <form id="leadForm">

    <input type="text" name="Full Name" placeholder="Full Name" required>
    <input type="text" name="Phone" placeholder="Phone" required>
    <input type="email" name="Email" placeholder="Email" required>
    <input type="text" name="Business Name" placeholder="Business Name">

    <select name="Industry">
      <option value="">Select Industry</option>
      <option>Real Estate</option>
      <option>Dental</option>
      <option>Automotive</option>
      <option>E-commerce</option>
      <option>Other</option>
    </select>

    <select name="Interest Level">
      <option value="">Interest Level</option>
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
    </select>

    <input type="number" name="Budget" placeholder="Monthly Budget (USD)">

    <textarea name="Notes" placeholder="Tell us about your needs"></textarea>

    <button type="submit">Deploy My Leads</button>

  </form>

</div>

<script>
document.getElementById("leadForm").addEventListener("submit", function(e){
  e.preventDefault();

  const formData = new FormData(this);

  formData.append("Lead ID", Date.now());
  formData.append("Date Captured", new Date().toISOString());
  formData.append("Source", "Landing Page");
  formData.append("Status", "New");
  formData.append("Assigned To", "Unassigned");
  formData.append("Conversion", "No");
  formData.append("Revenue Value", "0");

  fetch("https://script.google.com/macros/s/AKfycbzaSZFk4ZYiSgsqFNQJvmzC0pIKKtnCECUgzC-33X9HFFXxW5bIELkNO6NqN4X48ls62w/exec", {
  method: "POST",
  body: formData,
  mode: "cors"
})
  .then(() => {
    window.location.href = "thankyou.html";
  })
  .catch(() => {
    alert("Error submitting form");
  });
});
</script>

</body>
</html>
