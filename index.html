<!DOCTYPE html>
<html>
<body>

<form id="leadForm">
  <input name="Full Name" placeholder="Name" required>
  <input name="Email" placeholder="Email" required>
  <input name="Phone" placeholder="Phone">
  <input name="Business Name" placeholder="Business">
  <button type="submit">Submit</button>
</form>

<script>
document.getElementById("leadForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  fetch("https://script.google.com/macros/s/AKfycbxpuaBkGkInA09bAL_fKBOQXEtrY2gB2pxID-MrCXZ-eIF31BMhzpDAur6iXcTmTLVdtA/exec", {
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    console.log("Response:", data);

    if (data.status === "success") {
      alert("SUCCESS ✅");
    } else {
      alert("ERROR: " + data.message);
    }
  })
  .catch(err => {
    console.error("Fetch failed:", err);
    alert("REQUEST FAILED ❌");
  });
});
</script>

</body>
</html>
