<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #111827);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .container {
      background: #0a0a0a;
      padding: 40px;
      border-radius: 12px;
      width: 420px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .logo {
      display: block;
      margin: 0 auto 20px auto;
      max-width: 180px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    p {
      color: #ccc;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .highlight {
      color: #d4af37;
      font-weight: bold;
    }

    a {
      display: inline-block;
      padding: 10px 20px;
      background: #d4af37;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    a:hover {
      background: #b8962e;
    }
  </style>
</head>

<body>

<div class="container">

  <img src="007.jpg" alt="007 Leads Agent Logo" class="logo">

  <h1>MISSION RECEIVED</h1>

  <p>
    Your request has been successfully submitted.
  </p>

  <p>
    Our team will review your information and reach out to you 
    <span class="highlight">shortly during business hours</span>.
  </p>

  <p>
    Get ready — we’re about to deploy your next clients.
  </p>

  <a href="index.html">Back to Home</a>

</div>

</body>
</html>
